<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101018"><title>SGizmo — игра шпион</title><link rel="icon" type="image/svg+xml" href="pirate-cat.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js" defer></script><style>
:root{--bg:#101018;--card:#191922;--raised:#22222e;--line:#343341;--lime:#c5f36b;--text:#f2effa;--muted:#9997a8;--font:'DM Sans',sans-serif;--display:'Nunito',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#2b2740,transparent 58%),var(--bg);color:var(--text);font-family:var(--font)}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.top{max-width:1180px;height:76px;margin:auto;padding:0 26px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;color:var(--text);font:900 22px var(--display);text-decoration:none}.logo{width:39px;height:39px}.profile-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:30px;background:var(--card);color:var(--text);font-weight:700;font-size:12px}.avatar{width:45px;height:45px;display:grid;place-items:center;overflow:hidden;border-radius:14px;background:#30303d;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.small{width:29px;height:29px;border-radius:50%}.silhouette{position:relative;width:28px;height:28px;display:block}.silhouette:before{content:"";position:absolute;top:3px;left:9px;width:10px;height:10px;border-radius:50%;background:#9391a2}.silhouette:after{content:"";position:absolute;bottom:-6px;left:3px;width:22px;height:17px;border-radius:14px 14px 5px 5px;background:#9391a2}.page{max-width:1080px;margin:26px auto 60px;padding:0 24px}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1c1c27,#17171f);box-shadow:0 18px 55px #0003}.home-grid{display:grid;grid-template-columns:1.3fr .8fr;gap:16px}.welcome{padding:34px;text-align:center;display:flex;flex-direction:column;align-items:center}.logo-big{width:72px;height:72px;margin:6px auto 10px}.h1{margin:0;font:900 46px/1 var(--display);letter-spacing:-2px}.identity{width:min(100%,430px);margin:26px 0 17px;padding:11px;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);border-radius:15px;background:#22222d}.identity-copy{min-width:0;flex:1}.identity-name{font:800 16px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:var(--muted);font-size:11px}.actions{width:min(100%,430px)}.primary{width:100%;height:48px;border:0;border-radius:12px;background:var(--lime);color:#17191a;font-weight:800}.join-row{display:flex;gap:7px;margin-top:9px}.join-row input,.field{min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#121219;color:var(--text);outline:none}.join-row input{flex:1;text-transform:uppercase;letter-spacing:2px}.secondary,.small-btn{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#252530;color:var(--text);font-weight:700}.secondary:hover,.small-btn:hover{border-color:var(--lime)}.rooms{padding:22px;min-height:300px}.section-title{margin:0;font:800 17px var(--display)}.rooms-head,.room-top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.room-list{display:grid;gap:9px;margin-top:17px}.room-item,.player-item{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#20202a;display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{padding:5px 8px;border:1px solid #44434f;border-radius:8px;color:var(--lime);font-size:10px}.empty{height:205px;display:grid;place-content:center;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}.room-head{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.room-code{font:900 19px var(--display);letter-spacing:3px;color:var(--lime)}.room-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}.room-panel{padding:19px}.settings-grid{display:grid;gap:11px;margin:15px 0}.setting label{display:block;margin-bottom:5px;color:var(--muted);font-size:10px}.setting select,.setting input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#121219;color:var(--text)}.players{display:grid;gap:7px;margin:12px 0}.player-item{padding:8px 10px;font-size:12px}.player-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat{height:280px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:11px;background:#121219;border:1px solid var(--line);border-radius:12px}.message{max-width:95%;padding:8px 10px;border-radius:11px;background:#24242f;font-size:12px;line-height:1.4}.message.mine{align-self:flex-end;background:#293224}.message-head{margin-bottom:3px;color:var(--lime);font-size:10px;font-weight:700}.chat-form{display:flex;gap:7px;margin-top:8px}.chat-form input,.chat-form textarea{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;background:#121219;color:var(--text)}.chat-form button{border:0;border-radius:10px;padding:0 15px;background:var(--lime);color:#17191a;font-weight:800}.profile-dialog{width:min(440px,calc(100vw - 24px));padding:0;border:1px solid var(--line);border-radius:20px;background:#1a1a24;color:var(--text)}dialog::backdrop{background:#050509cc;backdrop-filter:blur(4px)}.modal{padding:24px}.modal h2{margin:0 0 18px;font:800 22px var(--display)}.modal .field{width:100%;margin:7px 0 13px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.file-label{display:block;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:center;background:#252530;cursor:pointer}.file-hint{margin:7px 0;color:var(--muted);font-size:10px;text-align:center}.error{min-height:14px;color:var(--bad);font-size:11px}.game-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:14px}.game-status{padding:20px;text-align:center}.phase{font:800 18px var(--display)}.clock{width:112px;height:112px;margin:19px auto;position:relative;border-radius:50%;background:conic-gradient(var(--lime) var(--progress,0%),#363543 0);display:grid;place-items:center}.clock:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#191922}.clock-face{position:relative;width:100%;height:100%;z-index:1}.clock-hand{position:absolute;left:calc(50% - 1px);top:22px;width:2px;height:35px;border-radius:2px;background:var(--lime);transform-origin:bottom center;transform:rotate(var(--hand,0deg))}.clock-pin{position:absolute;left:calc(50% - 4px);top:50%;width:8px;height:8px;border-radius:50%;background:#f2effa}.role-card{margin-top:15px;padding:14px;border:1px solid #474550;border-radius:13px;background:#22222d}.word{display:block;margin-top:5px;color:var(--lime);font:900 21px var(--display)}.reaction-row{display:flex;gap:5px;margin-top:6px}.reaction-row button{border:1px solid #454452;border-radius:7px;background:#292834;padding:3px 7px;font-size:10px}.vote-list{display:grid;gap:7px}.countdown{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#08080dd9;font:900 100px var(--display);color:var(--lime);animation:pulse .9s infinite alternate}@keyframes pulse{from{transform:scale(.88);opacity:.65}to{transform:scale(1);opacity:1}}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 15px;border:1px solid var(--line);border-radius:10px;background:#24242e;color:var(--text);font-size:12px;z-index:10}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){.top{height:65px;padding:0 14px}.page{margin:16px auto 35px;padding:0 12px}.home-grid,.room-grid,.game-grid{grid-template-columns:1fr}.welcome{padding:26px 18px}.rooms{min-height:220px}.room-head{padding:13px}.room-panel{padding:14px}.chat{height:230px}}
</style><style>@media(max-width:540px){.room-head{align-items:flex-start;flex-wrap:wrap}.room-head .row{width:100%;justify-content:space-between}.room-head .row .small-btn{flex:1;padding:8px 6px;font-size:10px}}</style></head><body>
<header class="top"><a class="brand" href="#" id="home-link"><svg class="logo" viewBox="0 0 64 64" role="img" aria-label="SGizmo — кот-пират"><rect x="2" y="2" width="60" height="60" rx="19" fill="#C5F36B"/><path d="M13 25 12 12l14 8a22 22 0 0 1 12 0l14-8-1 16c3 5 4 10 1 16-4 8-12 11-20 11S16 52 12 44c-3-6-2-13 1-19Z" fill="#17191A"/><path d="M23 33h.1M41 33h.1" stroke="#C5F36B" stroke-width="5" stroke-linecap="round"/><path d="M16 28 45 37" stroke="#C5F36B" stroke-width="2.5" stroke-linecap="round"/><path d="M36 28Q41 25 46 28L44 36Q40 38 36 35Z" fill="#17191A" stroke="#C5F36B" stroke-width="2"/><path d="M28 40q4 4 8 0M19 38l-8-2m8 7-8 1m35-6 8-2m-8 7 8 1" fill="none" stroke="#C5F36B" stroke-width="2.3" stroke-linecap="round"/><path d="M31 36h5l-2.5 3Z" fill="#C5F36B"/><circle cx="48" cy="18" r="3" fill="#C5F36B"/></svg><span>SGizmo</span></a><div class="profile-chip">Автор: s3rggg7</div></header>
<main class="page"><section id="home-screen"><div class="home-grid"><div class="card welcome"><svg class="logo-big" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="19" fill="#C5F36B"/><path d="M13 25 12 12l14 8a22 22 0 0 1 12 0l14-8-1 16c3 5 4 10 1 16-4 8-12 11-20 11S16 52 12 44c-3-6-2-13 1-19Z" fill="#17191A"/><path d="M23 33h.1M41 33h.1" stroke="#C5F36B" stroke-width="5" stroke-linecap="round"/><path d="M16 28 45 37" stroke="#C5F36B" stroke-width="2.5" stroke-linecap="round"/><path d="M36 28Q41 25 46 28L44 36Q40 38 36 35Z" fill="#17191A" stroke="#C5F36B" stroke-width="2"/><path d="M28 40q4 4 8 0M19 38l-8-2m8 7-8 1m35-6 8-2m-8 7 8 1" fill="none" stroke="#C5F36B" stroke-width="2.3" stroke-linecap="round"/><path d="M31 36h5l-2.5 3Z" fill="#C5F36B"/><circle cx="48" cy="18" r="3" fill="#C5F36B"/></svg><h1 class="h1">SGizmo</h1><div class="identity"><div class="avatar" id="home-avatar"></div><div class="identity-copy"><div class="identity-name" id="home-name">Игрок</div><div class="muted">Твой профиль</div></div><button class="small-btn" id="edit-profile">Изменить</button></div><div class="actions"><button class="primary" id="new-room">＋ Создать комнату</button><div class="join-row"><input id="join-code" inputmode="numeric" maxlength="5" placeholder="Пятизначный код"><button class="secondary" id="join-button">Войти</button></div></div></div><section class="card rooms"><div class="rooms-head"><h2 class="section-title">Открытые комнаты</h2><span class="pill" id="open-count">0</span></div><div class="room-list" id="open-rooms"><div class="empty">Загружаю комнаты…</div></div></section></div></section>
<section id="room-screen" class="hidden"><div class="card room-head"><div><div class="muted" id="room-owner"></div><div>Код комнаты <span class="room-code" id="room-code-label"></span></div></div><div class="row"><button class="small-btn" id="share-room">Копировать приглашение</button><button class="small-btn" id="leave-room">Покинуть комнату</button></div></div><div id="lobby-view" class="room-grid"><section class="card room-panel"><h2 class="section-title">Лобби</h2><div id="settings-area"></div><div id="players" class="players"></div><div class="row"><button class="secondary" id="ready-button">Готово</button><button class="small-btn hidden" id="add-bot">＋ Бот для теста</button></div></section><section class="card room-panel"><h2 class="section-title">Общий чат</h2><div class="chat" id="lobby-chat"></div><form class="chat-form" id="lobby-chat-form"><input id="lobby-message" maxlength="300" placeholder="Сообщение…"><button>➤</button></form></section></div>
<div id="game-view" class="game-grid hidden"><section class="card game-status"><div class="phase" id="phase-title"></div><p class="muted" id="phase-description"></p><div class="clock" id="clock"><div class="clock-face"><div class="clock-hand" id="clock-hand"></div><i class="clock-pin"></i></div></div><p class="muted" id="timer-caption"></p><div class="role-card hidden" id="role-card"></div><div id="host-secrets"></div><div id="vote-list" class="vote-list"></div><button class="primary hidden" id="restart-game">Начать заново</button></section><section class="card room-panel"><h2 class="section-title" id="game-chat-title">Раунд</h2><div class="chat" id="game-chat"></div><form class="chat-form hidden" id="turn-form"><input id="turn-message" maxlength="300" placeholder="Опиши слово, не называя его…"><button>Готово</button></form><button class="primary hidden" id="live-done">Мой ход окончен</button><form class="chat-form hidden" id="postgame-form"><input id="postgame-message" maxlength="300" placeholder="Обсудите игру…"><button>➤</button></form></section></div></section></main>
<dialog class="profile-dialog" id="profile-dialog"><form class="modal" id="profile-form"><h2>Профиль <button class="small-btn" type="button" id="close-profile" style="float:right">×</button></h2><div class="row"><div class="avatar" id="profile-preview"></div><div style="flex:1"><label for="nick">Никнейм</label><input class="field" id="nick" maxlength="18" required></div></div><label class="file-label" for="avatar-file">Загрузить фото с устройства</label><input id="avatar-file" class="hidden" type="file" accept="image/png,image/jpeg,image/webp"><p class="file-hint">JPG, PNG, WebP · до 8 МБ</p><button class="small-btn" type="button" id="remove-avatar">Убрать фото</button><p class="file-hint">Фото показывается участникам лобби</p><p id="profile-error" class="error"></p><div class="modal-actions"><button class="secondary" type="button" id="cancel-profile">Отмена</button><button class="primary">Сохранить</button></div></form></dialog>
<div class="toast hidden" id="toast"></div><div class="countdown hidden" id="countdown" aria-live="assertive"><div style="min-width:220px;padding:34px 46px;border:1px solid #c5f36b88;border-radius:28px;background:linear-gradient(145deg,#262638,#171720);box-shadow:0 0 70px #c5f36b33;text-align:center"><span id="countdown-number" style="display:block;font:900 100px/1 Nunito,sans-serif;color:#c5f36b"></span><small style="display:block;margin-top:12px;color:#f2effa;font:700 14px DM Sans,sans-serif;letter-spacing:2px">ИГРА НАЧИНАЕТСЯ</small></div></div><div class="error" id="connection-error" style="max-width:900px;margin:10px auto;text-align:center"></div></body></html>
