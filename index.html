<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101018"><meta name="description" content="SGizmo — игровые комнаты для компании."><title>SGizmo — лобби</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#101018;--surface:#191922;--surface-2:#20202b;--stroke:#30303e;--lime:#c5f36b;--text:#f1eff9;--muted:#9291a2;--font:'DM Sans',sans-serif;--display:'Nunito',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -18%,#28233a 0,transparent 58%),var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden}.topbar{height:82px;max-width:1180px;padding:0 32px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--text);font:900 22px var(--display);letter-spacing:-.7px}.brand-icon{width:38px;height:38px;display:block;filter:drop-shadow(0 6px 15px #c5f36b24)}.profile-shortcut{display:flex;align-items:center;gap:9px;padding:5px 13px 5px 5px;border:1px solid var(--stroke);border-radius:999px;background:#1a1a24;color:var(--text);font:700 12px var(--font);cursor:pointer;transition:border-color .2s}.profile-shortcut:hover{border-color:#66617d}.mini-avatar{width:30px;height:30px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#272735}.avatar-image{width:100%;height:100%;object-fit:cover}.silhouette{position:relative;width:28px;height:28px;display:block;overflow:hidden}.silhouette:before{content:"";position:absolute;top:3px;left:9px;width:10px;height:10px;border-radius:50%;background:#8c8a9b}.silhouette:after{content:"";position:absolute;bottom:-6px;left:3px;width:22px;height:17px;border-radius:14px 14px 6px 6px;background:#8c8a9b}.edit-mark{color:#aaa7b8;font-size:13px}.page{max-width:1080px;margin:42px auto 70px;padding:0 26px}.main-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);gap:18px;align-items:stretch}.panel{border:1px solid var(--stroke);border-radius:23px;background:linear-gradient(145deg,#1b1b26,#17171f);box-shadow:0 22px 65px #00000025}.welcome{min-height:510px;padding:38px 44px 30px;display:flex;flex-direction:column;align-items:center;text-align:center}.hero-mark{width:84px;height:84px;margin:6px auto 11px;filter:drop-shadow(0 10px 24px #c5f36b18)}h1{margin:0;font:900 clamp(42px,6vw,58px)/1 var(--display);letter-spacing:-2.7px}.identity{margin:29px 0 0;padding:13px 15px;display:flex;align-items:center;gap:13px;width:min(100%,440px);text-align:left;border:1px solid var(--stroke);border-radius:17px;background:#20202b}.hero-avatar{width:52px;height:52px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:16px;background:#2c2c39}.identity-copy{min-width:0;flex:1}.player-name{display:block;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 17px var(--display)}.identity-note{display:block;margin-top:3px;color:var(--muted);font-size:10px}.icon-edit{width:30px;height:30px;border:1px solid #3c3b4b;border-radius:10px;background:#292835;color:var(--lime);font-size:14px;cursor:pointer}.customize{height:36px;padding:0 12px;border:1px solid #41404e;border-radius:10px;background:#292835;color:var(--text);font:700 10px var(--font);white-space:nowrap;cursor:pointer}.customize:hover,.icon-edit:hover{border-color:var(--lime)}.actions{width:min(100%,440px);margin-top:19px}.create{width:100%;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:13px;background:var(--lime);color:#17191a;font:800 13px var(--font);cursor:pointer;transition:transform .18s,filter .18s}.create:hover{transform:translateY(-2px);filter:brightness(1.05)}.plus{font-size:21px;font-weight:400}.arrow{margin-left:auto;margin-right:16px;font-size:18px}.join{height:46px;margin-top:10px;padding:0 6px 0 14px;display:flex;align-items:center;gap:9px;border:1px solid var(--stroke);border-radius:12px;background:#15151d}.join-symbol{color:#9e9bac;font-size:17px}.join input{min-width:0;flex:1;height:100%;border:0;outline:0;background:transparent;color:var(--text);font:700 12px var(--font);letter-spacing:1.5px;text-transform:uppercase}.join input::placeholder{color:#797888;letter-spacing:0;text-transform:none;font-weight:500}.join button{height:33px;padding:0 13px;border:1px solid #3b3a48;border-radius:9px;background:#252530;color:#e3e1ec;font:700 10px var(--font);cursor:pointer}.join button:hover{border-color:var(--lime);color:var(--lime)}.rooms{min-height:510px;padding:25px 22px;display:flex;flex-direction:column}.rooms-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:17px;border-bottom:1px solid var(--stroke)}.rooms-title{margin:0;font:800 17px var(--display);letter-spacing:-.2px}.room-count{min-width:27px;height:27px;padding:0 8px;display:grid;place-items:center;border:1px solid #3a3947;border-radius:9px;background:#252530;color:var(--lime);font:800 11px var(--font)}.room-list{flex:1;display:grid;place-items:center}.empty-state{text-align:center}.empty-icon{width:58px;height:58px;margin:0 auto 15px;display:grid;place-items:center;border:1px solid #373644;border-radius:19px;background:#22212c;color:var(--lime)}.empty-icon svg{width:27px;height:27px}.empty-title{margin:0;color:#d9d7e4;font:700 13px var(--font)}.empty-caption{margin:7px 0 0;color:var(--muted);font-size:10px;line-height:1.55}.upload{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:43px;border:1px solid #44434f;border-radius:11px;background:#252530;color:var(--text);font:700 11px var(--font);cursor:pointer;transition:border-color .2s,color .2s}.upload:hover{border-color:var(--lime);color:var(--lime)}.upload svg{width:16px;height:16px}.file-hint{margin:8px 0 0;color:#888696;text-align:center;font-size:9px}.file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.dialog{width:min(420px,calc(100vw - 28px));max-width:none;padding:0;border:1px solid var(--stroke);border-radius:22px;background:#1a1a24;color:var(--text);box-shadow:0 30px 90px #0009}.dialog::backdrop{background:#07070bbd;backdrop-filter:blur(5px)}.dialog-card{position:relative;padding:28px}.dialog-close{position:absolute;top:17px;right:17px;width:31px;height:31px;border:1px solid #3a3948;border-radius:10px;background:#24242e;color:#b8b6c4;font-size:20px;cursor:pointer}.dialog-title{margin:0 0 21px;font:800 23px var(--display)}.dialog-avatar-wrap{width:82px;height:82px;margin:0 auto 18px;position:relative}.dialog-avatar{width:82px;height:82px;display:grid;place-items:center;overflow:hidden;border:2px solid #494752;border-radius:25px;background:#2a2935}.dialog-avatar .silhouette{transform:scale(1.5)}.input-label{display:block;margin:0 0 7px;color:#a8a6b5;font-size:9px;font-weight:800;letter-spacing:1px}.nickname{width:100%;height:43px;padding:0 12px;border:1px solid #3b3a48;border-radius:10px;outline:0;background:#121219;color:var(--text);font:600 13px var(--font)}.nickname:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c5f36b20}.upload{margin-top:16px}.error{min-height:15px;margin:8px 0 0;color:#ff8f88;font-size:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:11px}.dialog-actions button{height:38px;padding:0 15px;border-radius:10px;font:700 11px var(--font);cursor:pointer}.cancel{border:1px solid #3b3a48;background:transparent;color:#c5c2d0}.save{border:0;background:var(--lime);color:#17191a}.toast{position:fixed;z-index:10;left:50%;bottom:24px;max-width:calc(100vw - 28px);padding:12px 17px;border:1px solid #464552;border-radius:12px;background:#252530;color:var(--text);font-size:12px;font-weight:600;box-shadow:0 10px 30px #0007;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
@media(max-width:760px){.topbar{height:70px;padding:0 18px}.page{margin:24px auto 40px;padding:0 14px}.main-grid{grid-template-columns:1fr;gap:14px}.welcome{min-height:0;padding:31px 20px 24px}.hero-mark{width:70px;height:70px}.identity{margin-top:23px;padding:11px;gap:9px}.hero-avatar{width:47px;height:47px;border-radius:14px}.customize{padding:0 9px;font-size:9px}.rooms{min-height:250px;padding:19px}.room-list{min-height:155px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
@media(max-width:380px){.topbar{padding:0 13px}.page{width:100%;padding:0 10px}.main-grid{grid-template-columns:minmax(0,1fr)}.panel{min-width:0}.welcome{padding:27px 12px 20px}.identity{width:100%;padding:10px 8px;gap:7px}.identity-copy{min-width:0}.player-name{max-width:125px}.customize{display:none}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="#home" aria-label="SGizmo"><svg class="brand-icon" viewBox="0 0 64 64" role="img" aria-label="Логотип SGizmo"><rect x="2" y="2" width="60" height="60" rx="20" fill="#C5F36B"/><circle cx="32" cy="32" r="20" fill="none" stroke="#17191A" stroke-width="3.5" stroke-dasharray="82 44" transform="rotate(-35 32 32)"/><circle cx="32" cy="32" r="12" fill="none" stroke="#17191A" stroke-width="3.5" stroke-dasharray="35 41" transform="rotate(40 32 32)"/><path d="m32 21 3.2 7.8L43 32l-7.8 3.2L32 43l-3.2-7.8L21 32l7.8-3.2L32 21Z" fill="#17191A"/><circle cx="49" cy="14" r="3" fill="#17191A"/></svg><span>SGizmo</span></a><button class="profile-shortcut" id="open-profile-top" type="button" aria-label="Изменить профиль"><span class="mini-avatar" id="mini-avatar"></span><span id="mini-name">Игрок</span><span class="edit-mark" aria-hidden="true">✎</span></button></header>
<main class="page" id="home"><div class="main-grid"><section class="panel welcome" aria-labelledby="page-title"><svg class="hero-mark" viewBox="0 0 64 64" role="img" aria-label="Логотип SGizmo"><rect x="2" y="2" width="60" height="60" rx="20" fill="#C5F36B"/><circle cx="32" cy="32" r="20" fill="none" stroke="#17191A" stroke-width="3.5" stroke-dasharray="82 44" transform="rotate(-35 32 32)"/><circle cx="32" cy="32" r="12" fill="none" stroke="#17191A" stroke-width="3.5" stroke-dasharray="35 41" transform="rotate(40 32 32)"/><path d="m32 21 3.2 7.8L43 32l-7.8 3.2L32 43l-3.2-7.8L21 32l7.8-3.2L32 21Z" fill="#17191A"/><circle cx="49" cy="14" r="3" fill="#17191A"/></svg><h1 id="page-title">SGizmo</h1>
<div class="identity"><div class="hero-avatar" id="hero-avatar" aria-label="Ваш аватар"></div><div class="identity-copy"><span class="player-name" id="player-name">Игрок</span><span class="identity-note">Профиль игрока</span></div><button class="icon-edit" id="edit-profile" type="button" aria-label="Изменить ник и аватар">✎</button><button class="customize" id="customize-profile" type="button">Изменить</button></div>
<div class="actions"><button class="create" id="create-room" type="button"><span class="plus" aria-hidden="true">＋</span> Создать комнату <span class="arrow" aria-hidden="true">→</span></button><div class="join"><span class="join-symbol" aria-hidden="true">⌑</span><label class="sr-only" for="room-code">Код комнаты</label><input id="room-code" type="text" inputmode="text" autocomplete="off" maxlength="6" placeholder="Код комнаты"><button id="join-room" type="button">Войти</button></div></div></section>
<section class="panel rooms" aria-labelledby="rooms-title"><header class="rooms-head"><h2 class="rooms-title" id="rooms-title">Открытые комнаты</h2><span class="room-count" id="room-count">0</span></header><div class="room-list" id="room-list"><div class="empty-state"><div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h11A2.5 2.5 0 0 1 20 8.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 15.5v-7Z" stroke="currentColor" stroke-width="1.7"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><p class="empty-title">Пока нет открытых комнат</p><p class="empty-caption">Здесь появятся лобби,<br>к которым можно присоединиться</p></div></div></section></div></main>
<dialog class="dialog" id="profile-dialog" aria-labelledby="dialog-title"><form class="dialog-card" id="profile-form"><button class="dialog-close" id="close-dialog" type="button" aria-label="Закрыть">×</button><h2 class="dialog-title" id="dialog-title">Профиль</h2><div class="dialog-avatar-wrap"><div class="dialog-avatar" id="dialog-avatar"></div></div><label class="input-label" for="nickname">НИКНЕЙМ</label><input class="nickname" id="nickname" name="nickname" type="text" maxlength="18" autocomplete="nickname" placeholder="Твой ник"><label class="upload" for="avatar-file"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Загрузить фото с устройства</label><input class="file-input" id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp"><p class="file-hint">JPG, PNG или WebP · до 8 МБ</p><button class="upload" id="remove-avatar" type="button">Убрать фото</button><p class="file-hint">Фото хранится только в этом браузере</p><p class="error" id="profile-error" role="status" aria-live="polite"></p><div class="dialog-actions"><button class="cancel" id="cancel-profile" type="button">Отмена</button><button class="save" type="submit">Сохранить</button></div></form></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const PROFILE_KEY='sgizmo.profile.v1';
const MAX_FILE_SIZE=8*1024*1024;
const profileDialog=document.querySelector('#profile-dialog');
const nicknameInput=document.querySelector('#nickname');
const avatarFile=document.querySelector('#avatar-file');
const profileError=document.querySelector('#profile-error');
const toast=document.querySelector('#toast');
let profile=loadProfile();
let pendingAvatar=profile.avatar;
let toastTimer;
function loadProfile(){try{const saved=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null');const name=saved&&typeof saved.name==='string'?saved.name.trim().slice(0,18):'';const avatar=saved&&typeof saved.avatar==='string'&&/^data:image\/(?:webp|jpeg|png);base64,/i.test(saved.avatar)&&saved.avatar.length<400000?saved.avatar:null;return{name:name||'Игрок',avatar}}catch{return{name:'Игрок',avatar:null}}}
function renderAvatar(target,source){target.replaceChildren();if(source){const image=new Image();image.className='avatar-image';image.alt='';image.src=source;target.append(image);return}const silhouette=document.createElement('span');silhouette.className='silhouette';silhouette.setAttribute('aria-hidden','true');target.append(silhouette)}
function renderProfile(){document.querySelector('#player-name').textContent=profile.name;document.querySelector('#mini-name').textContent=profile.name;renderAvatar(document.querySelector('#hero-avatar'),profile.avatar);renderAvatar(document.querySelector('#mini-avatar'),profile.avatar)}
function showToast(message){toast.textContent=message;toast.classList.add('show');window.clearTimeout(toastTimer);toastTimer=window.setTimeout(()=>toast.classList.remove('show'),3200)}
function openProfile(){pendingAvatar=profile.avatar;avatarFile.value='';profileError.textContent='';nicknameInput.value=profile.name==='Игрок'?'':profile.name;renderAvatar(document.querySelector('#dialog-avatar'),pendingAvatar);profileDialog.showModal();nicknameInput.focus()}
async function readAvatar(file){if(!file)return null;if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Выбери изображение JPG, PNG или WebP.');if(file.size>MAX_FILE_SIZE)throw new Error('Файл слишком большой. Максимальный размер — 8 МБ.');const url=URL.createObjectURL(file);try{const image=new Image();image.src=url;await image.decode();const side=Math.min(image.naturalWidth,image.naturalHeight);const sx=(image.naturalWidth-side)/2;const sy=(image.naturalHeight-side)/2;const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const context=canvas.getContext('2d');if(!context)throw new Error('Не удалось обработать изображение.');context.drawImage(image,sx,sy,side,side,0,0,256,256);return canvas.toDataURL('image/webp',.82)}finally{URL.revokeObjectURL(url)}}
for(const selector of ['#open-profile-top','#edit-profile','#customize-profile'])document.querySelector(selector).addEventListener('click',openProfile);
document.querySelector('#close-dialog').addEventListener('click',()=>profileDialog.close());document.querySelector('#cancel-profile').addEventListener('click',()=>profileDialog.close());
avatarFile.addEventListener('change',async()=>{profileError.textContent='';const file=avatarFile.files&&avatarFile.files[0];if(!file)return;try{pendingAvatar=await readAvatar(file);renderAvatar(document.querySelector('#dialog-avatar'),pendingAvatar)}catch(error){profileError.textContent=error instanceof Error?error.message:'Не удалось загрузить фото.';avatarFile.value=''}});
document.querySelector('#remove-avatar').addEventListener('click',()=>{pendingAvatar=null;avatarFile.value='';profileError.textContent='';renderAvatar(document.querySelector('#dialog-avatar'),null)});
document.querySelector('#profile-form').addEventListener('submit',event=>{event.preventDefault();const name=nicknameInput.value.trim();if(!name){profileError.textContent='Введи никнейм.';nicknameInput.focus();return}const nextProfile={name,avatar:pendingAvatar};try{localStorage.setItem(PROFILE_KEY,JSON.stringify(nextProfile))}catch{profileError.textContent='Браузер не смог сохранить профиль. Попробуй изображение поменьше.';return}profile=nextProfile;renderProfile();profileDialog.close();showToast('Профиль сохранён')});
document.querySelector('#create-room').addEventListener('click',()=>showToast('Создание комнат скоро появится'));
document.querySelector('#join-room').addEventListener('click',()=>{const code=document.querySelector('#room-code').value.trim();showToast(code?'Вход в комнаты скоро появится':'Введи код комнаты')});document.querySelector('#room-code').addEventListener('input',event=>event.target.value=event.target.value.replace(/[^a-z0-9]/gi,'').toUpperCase());
renderProfile();
</script>
</body>
</html>
